kind = "api"
previewPath = "/api"
title = "ParkEn API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "PYTHONPATH=/home/runner/workspace/services/api python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT}"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "-q", "/home/runner/workspace/services/api/app"]

[services.production.run]
args = ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PYTHONPATH = "/home/runner/workspace/services/api"
PYTHONUNBUFFERED = "1"

[services.production.health.startup]
path = "/api/healthz"
